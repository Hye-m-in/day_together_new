# File: python_app/fly.toml
app = "daytogether-api"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["app"]

  # HTTP (80)
  [[services.ports]]
    port = 80
    handlers = ["http"]

  # HTTPS (443, TLS + HTTP)
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "20s"
    restart_limit = 0
